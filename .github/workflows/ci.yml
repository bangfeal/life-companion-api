name: CI
on: [push, pull_request]
jobs:
  check:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: companion
          POSTGRES_PASSWORD: companion
          POSTGRES_DB: life_companion_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U companion -d life_companion_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgres://companion:companion@localhost:5432/life_companion_test
      TEST_DATABASE_URL: postgres://companion:companion@localhost:5432/life_companion_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm audit --audit-level=moderate
      - run: npm run check
      - run: npm run test:integration
      - run: npm run db:migrate
      - run: npm run db:migrate
      - run: npm run openapi:generate
      - run: git diff --exit-code -- openapi.json
