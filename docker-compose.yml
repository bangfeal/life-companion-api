services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: companion
      POSTGRES_PASSWORD: companion
      POSTGRES_DB: life_companion
    ports:
      - '127.0.0.1:5432:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U companion -d life_companion']
      interval: 2s
      timeout: 3s
      retries: 20
volumes:
  postgres_data:
